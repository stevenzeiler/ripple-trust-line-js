  </defs>
  <style>
    .name { font: 700 50px "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: #f4f1ea; }
    .promise { font: 400 24px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d8d3c6; }
    .era { font: 600 15px "SFMono-Regular", Menlo, Consolas, monospace; fill: #5fd0e8; letter-spacing: 2px; }
    .stroke { fill: none; stroke: #5fd0e8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .fillA { fill: #5fd0e8; }
    .soft { fill: none; stroke: #5fd0e8; stroke-opacity: .35; stroke-width: 2; stroke-dasharray: 6 8; }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -140; } }
    .move { animation: flow 10s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .move { animation: none !important; } }
  </style>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
